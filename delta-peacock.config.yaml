# The reviewer reviewing its own pull requests; secrets come from the workflow, never from this file.
# The scm provider, the model and the cost caps come from dogfood.yml's environment: two tests load
# the configuration from the repository root and expect neither set here.
scm:
  comments: true
  commitStatus: true
# The whole changed files first, then files fetched on demand for everything outside them.
context:
  providers: [full_files, agentic]
  maxTokens: 12000
  maxToolRounds: 10
review:
  target: main
  displayName: Review
  summaryWhenClean: false
  guidelinesDir: guidelines
  # The general pass cost precision on the consumer bench; uncited findings are harvested instead.
  generalPass: false
  harvestUncited: true
  # Empty means every path; exclude always wins.
  include: []
  exclude:
    - "**/pnpm-lock.yaml"
    - "dist/**"
    - "coverage/**"
    - "bench/cases/**"
    - "schema/**"
    - "CHANGELOG.md"
  # Mechanical rules: a static check finds the lines, the model judges only those it cannot measure.
  checks:
    natural-comments: comments
gate:
  failOn: MAJOR
calibration:
  enabled: false
cache:
  enabled: true
stats:
  enabled: true
