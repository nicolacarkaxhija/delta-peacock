version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Playwright moves with the pinned image, never through this file.
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: "@playwright/test"
