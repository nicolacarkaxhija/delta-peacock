name: pages

# Deploys the feature tour at site/ to GitHub Pages. Runs on pushes to main
# that touch the site or its media. Enable Pages with "Source: GitHub Actions"
# in the repository settings for this to publish.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site with its media
        run: |
          mkdir -p _site/media
          cp site/index.html _site/index.html
          cp docs/media/*.gif _site/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
